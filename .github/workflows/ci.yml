name: quality
# Documentation-only changes run `.github/workflows/docs.yml` instead: the full matrix here
# spends four package builds and two macOS runners on a markdown edit, and none of that can be
# affected by prose. Anything touching code still runs every gate.
#
# Branches are gated by their pull request, not by the branch push: a push to a branch with an
# open PR otherwise starts a second full 11-job matrix on the same SHA (push and PR use different
# concurrency groups, so neither run cancels the other). Main and the merge queue still run the
# whole matrix, and `workflow_dispatch` remains available for a branch-only check.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.os }}
          cache-workspace-crates: true
      - name: Install media subprocesses (ffmpeg, ffprobe)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && \
             ffmpeg -version >/dev/null 2>&1 && ffprobe -version >/dev/null 2>&1; then
            echo 'Using installed FFmpeg and FFprobe'
            exit 0
          fi
          # Bound dependency setup separately from compilation; use the signed primary mirror.
          for source_file in /etc/apt/sources.list /etc/apt/*mirrors*.txt /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source_file" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends ffmpeg
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Install media subprocesses (ffmpeg, ffprobe)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: make check-rust
      - name: Linux placement acceptance
        if: runner.os == 'Linux'
        run: make check-linux

  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          python3 -m venv "$RUNNER_TEMP/quality-tools"
          "$RUNNER_TEMP/quality-tools/bin/pip" install uv==0.10.12
          echo "$RUNNER_TEMP/quality-tools/bin" >> "$GITHUB_PATH"
      - run: make check-tools

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.90.0
      - run: make check-msrv

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.0
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: make check-security

  # The header-only half of the CUDA gate. It compiles, lints and tests the cuda-gated modules,
  # which no other job does: `packages` builds the cuda feature but not the test targets, so a
  # test-only break there stays invisible. No device is opened, so a hosted runner is enough.
  cuda:
    name: CUDA (headers, no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CUDA build headers (no GPU required)
        timeout-minutes: 5
        run: |
          for source_file in /etc/apt/sources.list /etc/apt/*mirrors*.txt /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source_file" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          curl --fail --silent --show-error --location --connect-timeout 20 --max-time 60 --retry 1 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb \
            --output "$RUNNER_TEMP/cuda-keyring.deb"
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends \
            libclang-dev cuda-cudart-dev-13-2 cuda-crt-13-2 cuda-driver-dev-13-2 libcurand-dev-13-2
          test -f /usr/local/cuda-13.2/include/crt/host_config.h
          echo 'CUDA_HOME=/usr/local/cuda-13.2' >> "$GITHUB_ENV"
          # cuda-bindings generates bindings from cuda.h without a rerun-if-changed on the
          # header; salt the cache with the installed toolkit package versions so an apt
          # update at the same path cannot reuse bindings generated from older headers.
          echo "CUDA_TOOLKIT_CACHE_KEY=$(dpkg-query -W -f='${Package}=${Version}\n' cuda-cudart-dev-13-2 cuda-crt-13-2 cuda-driver-dev-13-2 libcurand-dev-13-2 | sort | paste -sd, -)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cuda-hosted
          cache-workspace-crates: true
          env-vars: CUDA_HOME CUDA_TOOLKIT_PATH CUDA_TOOLKIT_TARGET_DIR CUDA_TOOLKIT_CACHE_KEY
      - run: make test-cuda-hosted

  packages:
    name: Package (${{ matrix.target }})
    needs: [rust, tools, msrv, security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu.2.28
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu.2.28
            rust-target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CUDA build headers (no GPU required)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          for source_file in /etc/apt/sources.list /etc/apt/*mirrors*.txt /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source_file" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          curl --fail --silent --show-error --location --connect-timeout 20 --max-time 60 --retry 1 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb \
            --output "$RUNNER_TEMP/cuda-keyring.deb"
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends \
            libclang-dev cuda-cudart-dev-13-2 cuda-crt-13-2 cuda-driver-dev-13-2 libcurand-dev-13-2
          test -f /usr/local/cuda-13.2/include/crt/host_config.h
          echo 'CUDA_HOME=/usr/local/cuda-13.2' >> "$GITHUB_ENV"
          # cuda-bindings generates bindings from cuda.h without a rerun-if-changed on the
          # header; salt the cache with the installed toolkit package versions so an apt
          # update at the same path cannot reuse bindings generated from older headers.
          echo "CUDA_TOOLKIT_CACHE_KEY=$(dpkg-query -W -f='${Package}=${Version}\n' cuda-cudart-dev-13-2 cuda-crt-13-2 cuda-driver-dev-13-2 libcurand-dev-13-2 | sort | paste -sd, -)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.target }}
          cache-workspace-crates: true
          env-vars: CUDA_HOME CUDA_TOOLKIT_PATH CUDA_TOOLKIT_TARGET_DIR CUDA_TOOLKIT_CACHE_KEY
      - name: Select macOS SDK
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Install Zig
        run: |
          python3 -m pip install ziglang==0.16.0
          python3 -c 'import pathlib, ziglang; print("CARGO_ZIGBUILD_ZIG_PATH=" + str(pathlib.Path(ziglang.__file__).parent / "zig"))' >> "$GITHUB_ENV"
      - run: make setup-build
      - name: Build, test, package and verify
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: make package TARGET="$PACKAGE_TARGET"
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infer-${{ matrix.target }}
          path: artifacts/packages/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  quality-gate:
    if: ${{ always() }}
    needs: [rust, tools, msrv, security, packages, cuda]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success,success,success,success'
