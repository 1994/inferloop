[package]
name = "infer-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Case bodies under `tests/` are mounted from their module, so `tests/unit` and
# `tests/support` must not be auto-discovered as integration targets.
autotests = false

[[test]]
name = "cache"
path = "tests/cache.rs"

[[test]]
name = "kv_manager"
path = "tests/kv_manager.rs"

[lints]
workspace = true

[dependencies]
ahash.workspace = true
infer-core.workspace = true
infer-ir.workspace = true
serde.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
