[package]
name = "infer-backend-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Case bodies under `tests/` are mounted from their module, so `tests/unit` and
# `tests/support` must not be auto-discovered as integration targets.
autotests = false

[lints]
workspace = true

[features]
default = []
cuda = [
    "dep:cutile",
    "dep:cuda-core",
    "dep:sha2",
    "dep:infer-state",
    "dep:futures-channel",
    "dep:infer-cuda-kernels",
    "infer-cuda-kernels/tile",
]

[dependencies]
infer-core.workspace = true
infer-gpu-api.workspace = true
infer-ir.workspace = true
infer-models.workspace = true
infer-spi.workspace = true
infer-compiler.workspace = true
infer-kernel-api.workspace = true
infer-workloads.workspace = true
infer-cuda-kernels = { workspace = true, optional = true }
serde.workspace = true
tracing.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
infer-state = { workspace = true, optional = true }
cutile = { workspace = true, optional = true }
cuda-core = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
libloading.workspace = true
futures-channel = { workspace = true, optional = true }

[dev-dependencies]
infer-runtime.workspace = true
clap.workspace = true
infer-reference-ops.workspace = true
infer-state.workspace = true

[[example]]
name = "cuda-kernels"
required-features = ["cuda"]

