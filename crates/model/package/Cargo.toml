[package]
name = "infer-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Case bodies under `tests/` are mounted from their module, so `tests/unit` and
# `tests/support` must not be auto-discovered as integration targets.
autotests = false

[[test]]
name = "loader"
path = "tests/loader.rs"

[[test]]
name = "package"
path = "tests/package.rs"

[lints]
workspace = true

[dependencies]
fast_image_resize.workspace = true
llguidance.workspace = true
infer-core.workspace = true
infer-ir.workspace = true
infer-spi.workspace = true
infer-model-recipes.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokenizers.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
memmap2.workspace = true
regex.workspace = true

[dev-dependencies]
infer-compiler.workspace = true
