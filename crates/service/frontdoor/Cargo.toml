[package]
name = "infer-frontdoor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Case bodies under `tests/` are mounted from their module, so `tests/unit` and
# `tests/support` must not be auto-discovered as integration targets.
autotests = false

[[test]]
name = "cpu"
path = "tests/cpu.rs"

[[test]]
name = "isolation"
path = "tests/isolation.rs"

[[test]]
name = "output"
path = "tests/output.rs"

[lints]
workspace = true

[dependencies]
infer-core.workspace = true
infer-ir.workspace = true
infer-spi.workspace = true
infer-models.workspace = true
infer-runtime.workspace = true
infer-observe.workspace = true
serde.workspace = true
tracing.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
futures-util.workspace = true
base64.workspace = true
image.workspace = true

[dev-dependencies]
crc32fast.workspace = true
infer-workloads.workspace = true
tower.workspace = true
infer-model-recipes.workspace = true
infer-kernel-api.workspace = true
