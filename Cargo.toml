[workspace]
resolver = "2"
members = [
    "crates/foundation/core",
    "crates/foundation/ir",
    "crates/foundation/spi",
    "crates/backend/api",
    "crates/backend/kernel-api",
    "crates/backend/cuda-kernels",
    "crates/backend/metal",
    "crates/backend/cuda",
    "crates/model/package",
    "crates/model/compiler",
    "crates/model/recipes",
    "crates/engine/state",
    "crates/engine/scheduler",
    "crates/engine/workloads",
    "crates/engine/runtime",
    "crates/diagnostics/observe",
    "crates/diagnostics/quality",
    "crates/service/media",
    "crates/service/frontdoor",
    "crates/service/agent",
    "crates/service/cli",
    "crates/testing/cpu/reference-ops",
    # Development tool: a member so it shares the lock, versions and lints, but not part of the
    # default product build set.
    "tools/bench/cpu",
]

default-members = [
    "crates/foundation/core",
    "crates/foundation/ir",
    "crates/foundation/spi",
    "crates/backend/api",
    "crates/backend/kernel-api",
    "crates/backend/metal",
    "crates/model/package",
    "crates/model/compiler",
    "crates/model/recipes",
    "crates/engine/state",
    "crates/engine/scheduler",
    "crates/engine/workloads",
    "crates/engine/runtime",
    "crates/diagnostics/observe",
    "crates/diagnostics/quality",
    "crates/service/media",
    "crates/service/frontdoor",
    "crates/service/agent",
    "crates/service/cli",
    # Development tool, not part of the default product build set.
    "tools/bench/cpu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
llguidance = { version = "=1.9.1", default-features = false, features = ["lark"] }
infer-backend-cuda = { version = "=0.1.0", path = "crates/backend/cuda" }
infer-cuda-kernels = { version = "=0.1.0", path = "crates/backend/cuda-kernels" }
infer-media-input = { version = "=0.1.0", path = "crates/service/media" }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
mime = "0.3"
crc32fast = "1"
# png 0.18 (image 0.25's codec release) still requires miniz_oxide ^0.8 while flate2 1.1.10
# moved to ^0.9; the lockfile holds flate2 at 1.1.9 so both resolve to one miniz_oxide 0.8.9.
# Revisit when png's miniz_oxide range converges with flate2's.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
fast_image_resize = { version = "=6.1.0", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2", "system-proxy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rtrb = "0.4"
ahash = "=0.8.12"
btree-slab = "=0.6.1"
sha2 = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
futures-util = "0.3"
futures-channel = "0.3"
mimalloc = { version = "0.1.52", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Version source for the few dependencies that also need platform- or feature-specific
# declarations in a member: the member keeps the features, the workspace keeps the version.
cutile = "=0.4.0"
cuda-core = "=0.4.0"
metal = "=0.29.0"
minijinja = { version = "2", features = ["json", "fuel"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
memmap2 = "0.9"
objc = "0.2"
regex = "1"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tower = { version = "0.5", features = ["util"] }

# Foundation
infer-core = { version = "=0.1.0", path = "crates/foundation/core" }
infer-ir = { version = "=0.1.0", path = "crates/foundation/ir" }
infer-spi = { version = "=0.1.0", path = "crates/foundation/spi" }

# Device execution
infer-gpu-api = { version = "=0.1.0", path = "crates/backend/api" }
infer-kernel-api = { version = "=0.1.0", path = "crates/backend/kernel-api" }
infer-backend-metal = { version = "=0.1.0", path = "crates/backend/metal" }

# Model loading and compilation
infer-model-recipes = { version = "=0.1.0", path = "crates/model/recipes" }
infer-models = { version = "=0.1.0", path = "crates/model/package" }
infer-compiler = { version = "=0.1.0", path = "crates/model/compiler" }

# Engine
infer-state = { version = "=0.1.0", path = "crates/engine/state" }
infer-scheduler = { version = "=0.1.0", path = "crates/engine/scheduler" }
infer-workloads = { version = "=0.1.0", path = "crates/engine/workloads" }
infer-runtime = { version = "=0.1.0", path = "crates/engine/runtime" }

# Diagnostics
infer-observe = { version = "=0.1.0", path = "crates/diagnostics/observe" }
infer-quality = { version = "=0.1.0", path = "crates/diagnostics/quality" }

# Services
infer-frontdoor = { version = "=0.1.0", path = "crates/service/frontdoor" }
infer-agent = { version = "=0.1.0", path = "crates/service/agent" }

# Opt-in CPU references
infer-reference-ops = { version = "=0.1.0", path = "crates/testing/cpu/reference-ops" }

[workspace.lints.rust]
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
invalid_codeblock_attributes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
multiple_unsafe_ops_per_block = "deny"
unused_result_ok = "deny"
get_unwrap = "deny"
# Fully-qualified item paths are imports: keep one style across every crate. The threshold
# (clippy.toml `absolute-paths-max-segments`) leaves `crate::Error`-style two-segment paths alone;
# anything deeper must be brought into scope with `use`.
absolute_paths = "deny"
rc_mutex = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
